# QUESTOR — desktopovy shell (Tauri 2). Kompiluje se POUZE v CI (windows runner),
# na Macu se Rust toolchain nepredpoklada. Viz docs/NASAZENI.md.

[package]
name = "questor"
version = "0.2.0"
description = "QUESTOR — herni testovaci system"
authors = ["Zdenek Jirovsky"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "questor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
