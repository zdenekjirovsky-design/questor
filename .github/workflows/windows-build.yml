# QUESTOR — build instalátorů (Tauri 2): Windows NSIS + macOS DMG (universal)
# + updater artefakty, publikace do GitHub Release.
# Spouští se pushnutím tagu ve tvaru v* (např. v0.1.0). Detail: docs/NASAZENI.md.
name: windows-build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Instalátor ${{ matrix.platforma }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platforma: windows
            runner: windows-latest
            rust-targets: ''
            tauri-args: '--bundles nsis'
          - platforma: macos
            runner: macos-latest
            # Universal binárka: Intel i Apple Silicon v jednom .dmg.
            # (bundle targets se řídí tímhle přepínačem, ne tauri.conf.json)
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri-args: '--target universal-apple-darwin --bundles app,dmg'
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust buildu
        uses: swatinem/rust-cache@v2
        with:
          workspaces: aplikace/src-tauri

      - name: Instalace npm závislostí
        run: npm ci

      - name: Build frontendu (Vite)
        run: npm run build -w aplikace

      - name: Tauri build + nahrání do GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Podpis updateru — klíče vygenerované přes `npx tauri signer generate`,
          # uložené v Settings → Secrets and variables → Actions (viz docs/NASAZENI.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tauri.conf.json je v aplikace/src-tauri/
          projectPath: aplikace
          # Frontend je už postavený krokem výš, proto žádný beforeBuildCommand.
          args: ${{ matrix.tauri-args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'QUESTOR ${{ github.ref_name }}'
          releaseBody: |
            **Windows:** soubor `*-setup.exe` níže (aplikace se pak aktualizuje sama).
            **macOS:** soubor `*.dmg` níže — po instalaci při prvním otevření povolit
            v Nastavení systému → Soukromí a zabezpečení → „Přesto otevřít"
            (aplikace není notarizovaná u Applu).
          releaseDraft: false
          prerelease: false